name: API contract

on:
    pull_request:
    push:
        branches: [main]
    # Daily as well, so a server change that breaks an SDK call shows up
    # within a day, not at the SDK's next pull request.
    schedule:
        - cron: '0 6 * * 1-5'
    workflow_dispatch:

concurrency:
    group: api-contract-${{ github.ref }}
    cancel-in-progress: true

jobs:
    contract:
        timeout-minutes: 10
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Check every SDK call against the live API spec
              run: npm run test:contract
